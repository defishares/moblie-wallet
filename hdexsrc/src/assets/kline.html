                        ctx.fillText(`数据不足(${totalCandles}/${requiredCandles}根)`, labelX, labelY);
                    }
                    
                } else if (indicator === 'sar') {
                    const sar = this.indicators.sar;
                    
                    // 绘制SAR点
                    for (let i = 0; i < visibleData.length; i++) {
                        const sarData = sar[startIndex + i];
                        if (!sarData || sarData.value === null) continue;
                        
                        const x = this.padding.left + (i - fractionalOffset) * (this.candleWidth + this.candleSpacing) + this.candleWidth / 2;
                        const y = this.priceToY(sarData.value, priceRange);
                        
                        ctx.fillStyle = sarData.isUptrend ? '#0ECB81' : '#F6465D';
                        ctx.beginPath();
                        ctx.arc(x, y, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    const currentSar = sar[startIndex + visibleData.length - 1];
                    ctx.fillStyle = '#848E9C';
                    ctx.fillText(`SAR(0.02,0.2) ${currentSar && currentSar.value ? currentSar.value.toFixed(2) : '-'}`, labelX, 20);
                    
                } else if (indicator === 'avl') {
                    const avl = this.indicators.avl;
                    this.drawPriceLine(avl, startIndex, visibleData.length, fractionalOffset, priceRange, '#F0B90B', 1);
                    
                    const currentAvl = avl[startIndex + visibleData.length - 1];
                    ctx.fillStyle = '#F0B90B';
                    ctx.fillText(`AVL ${currentAvl ? currentAvl.toFixed(2) : '-'}`, labelX, 20);
                    
                } else if (indicator === 'super') {
                    const supertrend = this.indicators.super;
                    
                    // 绘制SuperTrend区域填充
                    ctx.lineWidth = 1;
                    
                    for (let i = 0; i < visibleData.length; i++) {
                        const stData = supertrend[startIndex + i];
                        if (!stData || stData.value === null) continue;
                        
                        const x = this.padding.left + (i - fractionalOffset) * (this.candleWidth + this.candleSpacing);
                        const stY = this.priceToY(stData.value, priceRange);
                        const candleData = visibleData[i];
                        const candleHigh = this.priceToY(candleData.high, priceRange);
                        const candleLow = this.priceToY(candleData.low, priceRange);
                        
                        // 根据趋势填充区域
                        if (stData.isUptrend) {
                            // 上升趋势：SuperTrend线到蜡烛顶部
                            ctx.fillStyle = 'rgba(14, 203, 129, 0.15)';
                            const topY = Math.min(stY, candleHigh);
                            const height = Math.abs(candleHigh - stY);
                            ctx.fillRect(x, topY, this.candleWidth, height);
                        } else {
                            // 下降趋势：SuperTrend线到蜡烛底部
                            ctx.fillStyle = 'rgba(246, 70, 93, 0.15)';
                            const height = Math.abs(candleLow - stY);
                            ctx.fillRect(x, stY, this.candleWidth, height);
                        }
                    }
                    
                    // 绘制SuperTrend线
                    ctx.lineWidth = 1.5;
                    let lastX = null, lastY = null, lastTrend = null;
                    
                    for (let i = 0; i < visibleData.length; i++) {
                        const stData = supertrend[startIndex + i];
                        if (!stData || stData.value === null) continue;
                        
                        const x = this.padding.left + (i - fractionalOffset) * (this.candleWidth + this.candleSpacing) + this.candleWidth / 2;
                        const y = this.priceToY(stData.value, priceRange);
                        
                        if (lastX !== null && lastTrend === stData.isUptrend) {
                            ctx.strokeStyle = stData.isUptrend ? '#0ECB81' : '#F6465D';
                            ctx.beginPath();
                            ctx.moveTo(lastX, lastY);
                            ctx.lineTo(x, y);
                            ctx.stroke();
                        }
                        
                        lastX = x;
                        lastY = y;
                        lastTrend = stData.isUptrend;
                    }
                    
                    const currentSuper = supertrend[startIndex + visibleData.length - 1];
                    const stColor = currentSuper && currentSuper.isUptrend ? '#0ECB81' : '#F6465D';
                    ctx.fillStyle = stColor;
                    ctx.fillText(`SUPERTREND(10,3) ${currentSuper && currentSuper.value ? currentSuper.value.toFixed(2) : '-'}`, labelX, 20);
                }
            }

            drawPriceLine(data, startIndex, count, fractionalOffset, priceRange, color, lineWidth) {
                const ctx = this.ctx;
                
                // 保存当前上下文并设置裁剪区域
                ctx.save();
                ctx.beginPath();
                ctx.rect(this.padding.left, this.padding.top, this.klineChartWidth, this.klineChartHeight);
                ctx.clip();
                
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth;
                
                let started = false;
                for (let i = 0; i < count; i++) {
                    const value = data[startIndex + i];
                    
                    if (value === null || value === undefined) {
                        // If we encounter a null, finish current path and reset
                        if (started) {
                            ctx.stroke();
                            started = false;
                        }
                        continue;
                    }
                    
                    const x = this.padding.left + (i - fractionalOffset) * (this.candleWidth + this.candleSpacing) + this.candleWidth / 2;
                    const y = this.priceToY(value, priceRange);
                    
                    if (!started) {
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        started = true;
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                
                // Finish the last path if we have one
                if (started) {
                    ctx.stroke();
                }
                
                // 恢复上下文
                ctx.restore();
            }

            drawInfoBox(data, crosshairX) {
                const ctx = this.ctx;
                const isLeft = crosshairX > this.width / 2;
                
                const change = data.close - data.open;
                const changePct = (change / data.open) * 100;
                const amplitude = ((data.high - data.low) / data.open) * 100;
                
                const changeColor = change >= 0 ? '#0ECB81' : '#F6465D';
                
                ctx.font = '9px monospace';;
                const lineHeight = 14;
                const padding = 6;
                
                // 计算每行的文本和颜色
                const lines = [
                    { text: this.formatDate(data.timestamp), color: '#FFFFFF' },
                    { text: `开: ${this.formatPrice(data.open)}`, color: '#FFFFFF' },
                    { text: `高: ${this.formatPrice(data.high)}`, color: '#FFFFFF' },
                    { text: `低: ${this.formatPrice(data.low)}`, color: '#FFFFFF' },
                    { text: `收: ${this.formatPrice(data.close)}`, color: '#FFFFFF' },
                    { text: `涨跌: ${change >= 0 ? '+' : ''}${this.formatPrice(change)}`, color: changeColor },
                    { text: `幅: ${changePct >= 0 ? '+' : ''}${changePct.toFixed(2)}%`, color: changeColor },
                    { text: `振幅: ${amplitude.toFixed(2)}%`, color: '#FFFFFF' },
                    { text: `量: ${data.volume.toFixed(2)}`, color: '#FFFFFF' }
                ];
                
                const maxWidth = Math.max(...lines.map(line => ctx.measureText(line.text).width));
                const boxWidth = maxWidth + padding * 2;
                const boxHeight = lines.length * lineHeight + padding * 2;
                
                const boxX = isLeft ? this.padding.left + 10 : this.width - this.padding.right - boxWidth - 10;
                const boxY = this.padding.top + 10;
                
                // 半透明背景
                ctx.fillStyle = 'rgba(30, 35, 41, 0.9)';
                ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
                
                // 绘制文本（不同颜色）
                ctx.textAlign = 'left';
                lines.forEach((line, i) => {
                    ctx.fillStyle = line.color;
                    ctx.fillText(line.text, boxX + padding, boxY + padding + (i + 1) * lineHeight - 2);
                });
            }
        }

        let chart = null;

        const handleMessage = (event) => {
            try {
                const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
                if (data.type === 'KLINE_DATA') {
                    // 全量数据更新
                    if (!chart) {
                        chart = new KlineChart();
                    }
                    chart.setData(data.data, data.interval || '1h');
                } else if (data.type === 'UPDATE_LATEST_CANDLE') {
                    // 增量更新最新蜡烛
                    if (chart && data.data && data.data.length > 0) {
                        chart.updateLatestCandle(data.data[0]);
                    }
                } else if (data.type === 'UPDATE_LOADING_TEXT') {
                    document.getElementById('loading').innerText = data.text || '';
                }
            } catch (e) {
                console.error('Error:', e);
            }
        };

        window.addEventListener('message', handleMessage);
        document.addEventListener('message', handleMessage);

        document.addEventListener('DOMContentLoaded', () => {
            chart = new KlineChart();
            
            document.querySelectorAll('.timeBtn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.timeBtn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const interval = btn.dataset.interval;
                    
                    if (chart) {
                        chart.changeInterval(interval);
                    }
                    
                    // 向 React Native 发送 interval 变更消息
                    if (window.ReactNativeWebView) {
                        document.getElementById('loading').innerText = "加载中...";
                        window.ReactNativeWebView.postMessage(JSON.stringify({
                            type: 'CHANGE_INTERVAL',
                            interval: interval
                        }));
                        console.log('向RN发送interval变更:', interval);
                    }
                });
            });
            
            document.querySelectorAll('.indicatorBtn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const type = btn.dataset.type;
                    const indicator = btn.dataset.indicator;
                    
                    if (type === 'main') {
                        // 主图指标单选（可以取消）
                        const wasActive = btn.classList.contains('active');
                        document.querySelectorAll('.indicatorBtn[data-type="main"]').forEach(b => b.classList.remove('active'));
                        
                        if (!wasActive) {
                            // 之前未选中，现在选中
                            btn.classList.add('active');
                        }
                    } else {
                        // 副图指标多选
                        btn.classList.toggle('active');
                    }
                    
                    if (chart) {
                        chart.toggleIndicator(indicator, type);
                    }
                });
            });
        });
    </script>
</body>
</html>
